services:
  api:
    image: taskapi:local
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-local}
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    restart: unless-stopped
  tests:
    profiles: [test]
    build:
      context: .
      target: test
    volumes:
      - ./TestResults:/results
