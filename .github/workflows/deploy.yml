name: Deploy staging or rollback
on:
  workflow_call:
    inputs:
      image_ref:
        type: string
        required: true
      expected_version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      image_ref:
        description: 'ghcr.io/owner/repo@sha256:... (copy from a successful publish)'
        type: string
        required: true
      expected_version:
        description: 'Full 40-character commit SHA built into that image'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: staging-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Upload and deploy
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_USER }}
          IMAGE_REF: ${{ inputs.image_ref }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_REF" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]] || exit 1
          [[ "$EXPECTED_VERSION" =~ ^[a-f0-9]{40}$ ]] || exit 1
          ssh -o BatchMode=yes "$USER@$HOST" 'mkdir -p ~/cicd-taskapi'
          scp deploy/compose.yaml deploy/deploy.sh "$USER@$HOST:cicd-taskapi/"
          ssh -o BatchMode=yes "$USER@$HOST" "cd ~/cicd-taskapi && IMAGE_REF='$IMAGE_REF' EXPECTED_VERSION='$EXPECTED_VERSION' bash deploy.sh"
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
